[project]
name = "mcoolio"
version = "0.1.0"
description = "Visualizzatore TUI per file .mcool (Hi-C)"
readme = "README.md"
authors = [
    { name = "debusercccp", email = "roccosorix@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
mcoolio = "mcoolio.app:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
